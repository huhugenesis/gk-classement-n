# GK Nintendo Classement — empêche la mise en pause de Supabase (offre gratuite : pause après 7 jours d'inactivité)
# À placer dans le dépôt GitHub de l'explorateur, au chemin : .github/workflows/keepalive.yml
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'   # tous les 3 jours, à 6h17 UTC
  workflow_dispatch:          # permet aussi de le lancer à la main (onglet Actions)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/consoles?select=code&limit=1" \
               -H "apikey: ${{ secrets.SUPABASE_KEY }}"
          echo ""
          echo "Supabase a répondu : projet maintenu actif."
