<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propositions — GK Nintendo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0b11; --bg2:#13131c; --bg3:#1b1b26; --bg4:#242432;
  --line:#26262f; --line2:#33333f;
  --text:#ececf2; --text2:#9b9bb0; --text3:#6a6a80;
  --accent:#7c6af0;
  --ok:#22c55e; --warn:#fb923c; --danger:#f87171;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;padding:24px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--text2);font-size:14px;margin:0 0 22px}
.banner{background:rgba(124,106,240,.12);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--text2);margin-bottom:20px}
.admin-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text3);margin-bottom:18px;cursor:pointer}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.txt{flex:1;min-width:180px;background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px}
input.txt:focus{outline:none;border-color:var(--accent)}
.date{max-width:170px}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);border:none;border-radius:9px;padding:10px 16px;color:#fff;font-weight:600;font-size:14px}
.btn.ghost{background:var(--bg3);border:1px solid var(--line2);color:var(--text)}
.fld{display:block;font-size:11.5px;color:var(--text3);margin-bottom:4px}
input.date{color-scheme:dark}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.85;cursor:pointer}
.msg{font-size:12.5px;margin-top:8px;min-height:16px}
.msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
.sort{display:flex;gap:6px;margin:6px 0 12px}
.chip{background:var(--bg3);border:1px solid var(--line2);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--text2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.prop{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:none}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.vote button{background:var(--bg3);border:1px solid var(--line2);border-radius:8px;width:38px;height:30px;font-size:15px;color:var(--text)}
.vote button.voted{background:var(--accent);border-color:var(--accent);color:#fff}
.vote .n{font-family:var(--mono);font-weight:700;font-size:14px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600}
.pmeta{font-size:12px;color:var(--text3)}
.tagsoon{display:inline-block;font-size:10.5px;background:rgba(251,146,60,.16);color:var(--warn);border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.del{background:none;border:none;color:var(--text3);font-size:16px;padding:4px 8px;border-radius:6px}
.del:hover{color:var(--danger);background:rgba(248,113,113,.12)}
.hidden{display:none}
.count{color:var(--text3);font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Proposez les prochains sondages</h1>
  <p class="lead">Un jeu qui manque au classement ? Proposez-le, et votez pour ceux que vous voulez voir passer au sondage.</p>

  <div class="card">
    <h2>Proposer un jeu</h2>
    <div class="row">
      <div style="flex:1;min-width:180px">
        <label class="fld">Nom du jeu</label>
        <input class="txt" id="gameName" placeholder="ex. Chrono Trigger" style="width:100%">
      </div>
      <div>
        <label class="fld">Date de sortie du jeu</label>
        <input class="txt date" id="gameDate" type="date" title="Date de sortie du jeu">
      </div>
      <button class="btn" onclick="propose()" style="align-self:flex-end">Proposer</button>
    </div>
    <div class="msg" id="proposeMsg"></div>
    <div id="confirmBox" class="hidden" style="margin-top:10px;background:var(--bg3);border:1px solid var(--warn);border-radius:9px;padding:11px 13px">
      <div id="confirmTxt" style="font-size:13px;margin-bottom:9px"></div>
      <div class="row">
        <button class="btn ghost" id="confirmVote">Oui, voter pour ce jeu</button>
        <button class="btn ghost" id="confirmNew">Non, c'est un autre jeu</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Propositions en attente <span class="count" id="listCount"></span></h2>
    <div class="sort">
      <button class="chip on" id="sortVotes" onclick="setSort('votes')">Les plus demandés</button>
      <button class="chip" id="sortRecent" onclick="setSort('recent')">Ajoutés le plus récemment</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
// ---- Connexion Supabase ----
const SUPABASE_URL = 'https://xgebwtrylnlldpdpftdi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nUXVKJERtAhamraDAW7aGg_imUuVNYM';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let PROPS = [];   // rempli depuis la base
let sort='votes';

// Marqueur local des votes de CE navigateur (anti multi-vote léger)
const VOTED_KEY='gk_prop_voted';
function myVotes(){ try{ return new Set(JSON.parse(localStorage.getItem(VOTED_KEY)||'[]')); }catch(e){ return new Set(); } }
function saveMyVotes(set){ try{ localStorage.setItem(VOTED_KEY, JSON.stringify([...set])); }catch(e){} }

async function load(){
  const listEl=document.getElementById('list');
  listEl.innerHTML='<p style="color:var(--text3)">Chargement…</p>';
  const { data, error } = await db.from('propositions').select('*');
  if(error){ listEl.innerHTML='<p style="color:var(--danger)">Erreur de connexion : '+error.message+'</p>'; return; }
  const mine=myVotes();
  PROPS=(data||[]).map(r=>({ id:r.id, name:r.nom, date:r.date_sortie, votes:r.votes||0, created:r.created_at, mine:mine.has(String(r.id)) }));
  render();
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const ALREADY_POLLED_NAMES = ['Ocarina of Time','Super Mario Bros. 3','Tetris','Celeste'];
const ALREADY_POLLED = new Set(ALREADY_POLLED_NAMES.map(n=>norm(n)));

// Distance de Levenshtein (nb de modifications pour passer d'une chaîne à l'autre)
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
  }
  return d[m][n];
}
// Similarité 0..1 basée sur la distance rapportée à la longueur
function similarity(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  const dist=levenshtein(a,b), maxLen=Math.max(a.length,b.length);
  return 1 - dist/maxLen;
}
// Chevauchement de mots (pour titres partiels/étendus : « Metroid Prime 4 » vs « ... Beyond »)
function wordOverlap(a,b){
  const wa=new Set(norm(a).split(' ').filter(w=>w.length>1));
  const wb=new Set(norm(b).split(' ').filter(w=>w.length>1));
  if(!wa.size||!wb.size) return 0;
  let common=0; wa.forEach(w=>{ if(wb.has(w)) common++; });
  return common/Math.min(wa.size,wb.size); // part des mots du plus court qu'on retrouve dans l'autre
}
// Cherche la proposition existante la plus proche (hors correspondance exacte déjà gérée)
function findSimilar(nm){
  let best=null,bestScore=0,bestPolled=false;
  const scan=(obj,isPolled)=>{
    const name=obj.name;
    const sim=similarity(nm,name);
    const ov=wordOverlap(nm,name);
    const score=Math.max(sim, ov>=0.8 ? 0.9 : 0);
    if(score>bestScore){ bestScore=score; best=obj; bestPolled=isPolled; }
  };
  PROPS.forEach(p=>scan(p,false));                       // objet proposition complet (avec id)
  ALREADY_POLLED_NAMES.forEach(n=>scan({name:n},true));  // jeu sondé : juste le nom
  return (best && bestScore>=0.72) ? {p:best,score:bestScore,polled:bestPolled} : null;
}
let pendingSimilar=null; // proposition suspectée + saisie en cours
const RECENT_MONTHS=6; // délai minimal après sortie

function isTooRecent(dateStr){
  if(!dateStr) return false;
  const d=new Date(dateStr), now=new Date();
  const months=(now-d)/(1000*60*60*24*30.44);
  return months < RECENT_MONTHS; // sorti il y a moins de 6 mois (ou pas encore sorti)
}
function fmtDate(dateStr){
  if(!dateStr) return 'date inconnue';
  const d=new Date(dateStr);
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('fr-FR',{year:'numeric',month:'short'});
}

async function propose(){
  const nm=document.getElementById('gameName').value.trim();
  const dt=document.getElementById('gameDate').value;
  const msg=document.getElementById('proposeMsg');
  msg.className='msg warn';
  if(!nm){ msg.textContent='Indiquez le nom du jeu.'; return; }
  if(ALREADY_POLLED.has(norm(nm))){ msg.textContent='« '+nm+' » a déjà été sondé : il est dans le classement.'; return; }
  const existing=PROPS.find(p=>norm(p.name)===norm(nm));
  if(existing){
    if(existing.mine){ msg.textContent='Vous avez déjà proposé « '+existing.name+' ».'; return; }
    await addVote(existing);
    msg.className='msg ok'; msg.textContent='« '+existing.name+' » était déjà proposé — votre voix a été ajoutée.';
    clearInputs(); return;
  }
  const near=findSimilar(nm);
  if(near){
    pendingSimilar={name:nm, date:dt, match:near.p, polled:near.polled};
    const cb=document.getElementById('confirmBox');
    if(near.polled){
      document.getElementById('confirmTxt').innerHTML =
        'Attention, cela ressemble à <b>'+near.p.name+'</b>, qui a <b>déjà été sondé</b> et figure au classement.<br>'+
        '<span style="color:var(--text3);font-size:12px">Votre saisie : « '+nm+' »</span>';
      document.getElementById('confirmVote').classList.add('hidden');
    } else {
      document.getElementById('confirmTxt').innerHTML =
        'Vouliez-vous dire <b>'+near.p.name+'</b>, déjà proposé ?<br>'+
        '<span style="color:var(--text3);font-size:12px">Votre saisie : « '+nm+' »</span>';
      document.getElementById('confirmVote').classList.remove('hidden');
    }
    cb.classList.remove('hidden'); msg.textContent=''; return;
  }
  await insertProp(nm, dt, msg);
}

function clearInputs(){ document.getElementById('gameName').value=''; document.getElementById('gameDate').value=''; }

async function insertProp(nm, dt, msg){
  const row={ nom:nm, date_sortie:dt||null, votes:1 };
  const { data, error } = await db.from('propositions').insert(row).select().single();
  if(error){ msg.className='msg warn'; msg.textContent='Enregistrement impossible : '+error.message; return; }
  // marquer comme voté par ce navigateur
  const mv=myVotes(); mv.add(String(data.id)); saveMyVotes(mv);
  msg.className='msg ok';
  msg.textContent = isTooRecent(dt)
    ? 'Proposition ajoutée. Note : ce jeu est récent, il sera sans doute mis de côté le temps qu\'il mûrisse.'
    : 'Proposition ajoutée. Merci !';
  clearInputs();
  await load();
}

// Incrémente le compteur de votes d'une proposition existante (et mémorise localement)
async function addVote(p){
  const mv=myVotes();
  const { data, error } = await db.from('propositions').update({ votes:(p.votes||0)+1 }).eq('id',p.id).select().single();
  if(error){ return; }
  mv.add(String(p.id)); saveMyVotes(mv);
  await load();
}
async function removeVote(p){
  const mv=myVotes();
  const { error } = await db.from('propositions').update({ votes:Math.max(0,(p.votes||0)-1) }).eq('id',p.id);
  if(error){ return; }
  mv.delete(String(p.id)); saveMyVotes(mv);
  await load();
}

async function toggleVote(id){
  const p=PROPS.find(x=>x.id===id); if(!p) return;
  if(p.mine) await removeVote(p); else await addVote(p);
}
function setSort(s){ sort=s;
  document.getElementById('sortVotes').classList.toggle('on',s==='votes');
  document.getElementById('sortRecent').classList.toggle('on',s==='recent');
  render();
}

function render(){
  const list=[...PROPS].sort((a,b)=> sort==='votes' ? b.votes-a.votes : b.id-a.id);
  document.getElementById('listCount').textContent='('+PROPS.length+')';
  document.getElementById('list').innerHTML = list.map(p=>{
    const soon=isTooRecent(p.date);
    return '<div class="prop">'+
      '<div class="vote">'+
        '<button class="'+(p.mine?'voted':'')+'" onclick="toggleVote('+p.id+')" title="'+(p.mine?'Retirer mon vote':'Je veux voir ce sondage')+'">'+(p.mine?'✓':'▲')+'</button>'+
        '<span class="n">'+p.votes+'</span>'+
      '</div>'+
      '<div class="pinfo">'+
        '<div class="pname">'+p.name+ (soon?'<span class="tagsoon">trop récent</span>':'') +'</div>'+
        '<div class="pmeta">Sortie : '+fmtDate(p.date)+'</div>'+
      '</div>'+
    '</div>';
  }).join('') || '<p style="color:var(--text3)">Aucune proposition pour l\'instant.</p>';
}
document.getElementById('confirmVote').onclick=async ()=>{
  if(!pendingSimilar) return;
  const m=PROPS.find(x=>x.id===pendingSimilar.match.id);
  document.getElementById('confirmBox').classList.add('hidden');
  const msg=document.getElementById('proposeMsg');
  if(m && !m.mine){ await addVote(m); msg.className='msg ok'; msg.textContent='Votre voix a été ajoutée à « '+m.name+' ».'; }
  else { msg.className='msg warn'; msg.textContent='Vous aviez déjà voté pour ce jeu.'; }
  clearInputs(); pendingSimilar=null;
};
document.getElementById('confirmNew').onclick=async ()=>{
  if(!pendingSimilar) return;
  document.getElementById('confirmBox').classList.add('hidden');
  const msg=document.getElementById('proposeMsg');
  await insertProp(pendingSimilar.name, pendingSimilar.date, msg);
  pendingSimilar=null;
};
load();
</script>
</body>
</html>
